# Automated 4-channel OIDC release & multi-registry publish workflow.
# Publishes GitHub Release, npm (SLSA OIDC Trusted Publisher), PyPI (OIDC Trusted Publisher),
# and Official MCP Registry (GitHub OIDC + Sigstore Cosign verification).

name: Release & Publish

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "server.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.16

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    environment: Digital-Lake-ModelCanon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect version change
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          new_version=$(jq -r .version package.json)
          old_version=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version 2>/dev/null || echo "")
          echo "new_version=$new_version"
          echo "old_version=$old_version"
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && [ "$new_version" = "$old_version" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Upgrade npm CLI to latest (>= 11.5.1 required for tokenless OIDC)
        if: steps.detect.outputs.should_release == 'true'
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies & verify
        if: steps.detect.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.new_version }}
        run: |
          npm ci
          npm run version:check
          grep -Fq "## [${VERSION}]" CHANGELOG.md
          npm run lint
          npm run build
          npm run seed:check
          npm test

      - name: Create GitHub Release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.detect.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes
          fi

      - name: Publish to npm (OIDC Trusted Publisher, idempotent)
        if: steps.detect.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@digital-lake/modelcanon@${VERSION}" version >/dev/null 2>&1; then
            echo "@digital-lake/modelcanon@${VERSION} is already published on npm; skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Setup Python 3.12
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Python sdist & wheel
        if: steps.detect.outputs.should_release == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist-pypi

      - name: Publish to PyPI (OIDC Trusted Publisher)
        if: steps.detect.outputs.should_release == 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/

      - name: Install Cosign (verify mcp-publisher)
        if: steps.detect.outputs.should_release == 'true'
        uses: sigstore/cosign-installer@v4.1.3

      - name: Download & verify mcp-publisher
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity-regexp "https://github.com/modelcontextprotocol/registry/.+" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar -xzf "$archive" mcp-publisher
          chmod +x mcp-publisher

      - name: Publish server.json to Official MCP Registry (GitHub OIDC)
        if: steps.detect.outputs.should_release == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Waiting 25s for npm CDN propagation before retry (${attempt}/6)..."
            sleep 25
          done
          exit 1
